name: Zalo Member Mini App Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which version to upload (Testing is the one you submit to Zalo for review before publishing)'
        type: choice
        options: [development, testing]
        default: development
  push:
    branches: [main]
    paths:
      - 'zalo_member_mini_app/**'
      - '.github/workflows/zalo-member-mini-app.yml'

# Never run two deploys at once; a newer push supersedes a queued one.
concurrency:
  group: zalo-member-mini-app-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zalo_member_mini_app
    env:
      APP_ID: '142578969708561965'
      ZMP_TOKEN: ${{ secrets.ZMP_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: zalo_member_mini_app/package-lock.json

      # A pasted secret often carries a trailing newline or quotes, which makes
      # Node reject the Authorization header. Strip them (JWTs contain neither).
      - name: Check and clean ZMP_TOKEN secret
        run: |
          if [ -z "$ZMP_TOKEN" ]; then
            echo "::error::Missing repository secret ZMP_TOKEN. Run 'zmp login' once and add the token from .env as a secret."
            exit 1
          fi
          CLEAN=$(printf '%s' "$ZMP_TOKEN" | tr -d '[:space:]"'"'"'')
          if [ -z "$CLEAN" ] || printf '%s' "$CLEAN" | LC_ALL=C grep -q '[^!-~]'; then
            echo "::error::ZMP_TOKEN contains invalid characters. Re-copy the token from .env into the secret."
            exit 1
          fi
          echo "::add-mask::$CLEAN"
          echo "ZMP_TOKEN=$CLEAN" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Install zmp-cli
        run: npm install -g zmp-cli

      # Pushes to main upload the Development version; the Zalo app picks it up on next open.
      # A manual run with target=testing uploads the Testing version instead, which is what gets
      # submitted for Zalo's review and then published to everyone from the Mini App console.
      # Zalo caps the version description at 500 chars, so send only the commit's first line.
      # The message goes through an env var so it is never interpolated into the shell script.
      - name: Deploy to Zalo Mini App
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          TARGET: ${{ github.event.inputs.target }}
        run: |
          FIRST_LINE=$(printf '%s' "${COMMIT_MESSAGE:-manual deploy}" | head -n 1 | cut -c1-120)
          if [ "$TARGET" = "testing" ]; then
            zmp deploy -e -p -t -m "${GITHUB_SHA::7} ${FIRST_LINE}"
          else
            zmp deploy -e -p -m "${GITHUB_SHA::7} ${FIRST_LINE}"
          fi
