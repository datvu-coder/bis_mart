name: VPS Ops

# Maintenance actions for the backend VPS. diagnose/restart_backend/
# set_admin stay manually-triggered (tap "Run workflow" from the GitHub
# app/web on a phone — no terminal or SSH client needed on the operator's
# device). deploy_backend also runs automatically on every push to main
# that touches backend/, so schema/code fixes take effect on production
# without a separate manual step — this workflow already gates that on a
# post-deploy healthz check and fails loudly if it doesn't return 200.
#
# The workflow itself holds the SSH key (as a repo secret) and does the
# SSH/DB work.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Hành động'
        required: true
        default: 'diagnose'
        type: choice
        options:
          - diagnose
          - restart_backend
          - deploy_backend
          - set_admin

jobs:
  ops:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: ${{ github.event_name == 'push' || github.event.inputs.action == 'deploy_backend' }}
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H 146.196.64.92 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Diagnose backend
        if: ${{ github.event.inputs.action == 'diagnose' }}
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=accept-new root@146.196.64.92 '
            set -e
            echo "=== containers ==="
            docker ps -a
            echo
            echo "=== backend logs (last 150 lines) ==="
            docker logs --tail 150 bis_mart_backend 2>&1 || echo "(khong tim thay container bis_mart_backend)"
            echo
            echo "=== backend health ==="
            docker inspect --format="Status: {{.State.Status}}  Health: {{if .State.Health}}{{.State.Health.Status}}{{else}}(no healthcheck){{end}}" bis_mart_backend 2>&1 || true
            echo
            echo "=== bis_mart_backend env (DATABASE_URL credentials redacted) ==="
            docker inspect bis_mart_backend --format "{{json .Config.Env}}" | sed -E "s#//[^:]+:[^@]+@#//REDACTED:REDACTED@#g"
            echo
            echo "=== bis_mart_backend labels ==="
            docker inspect bis_mart_backend --format "{{json .Config.Labels}}"
            echo
            echo "=== bis_mart_backend networks ==="
            docker inspect bis_mart_backend --format "{{json .NetworkSettings.Networks}}"
            echo
            echo "=== giaoviec env (DATABASE_URL credentials redacted) ==="
            docker inspect giaoviec --format "{{json .Config.Env}}" 2>&1 | sed -E "s#//[^:]+:[^@]+@#//REDACTED:REDACTED@#g"
            echo
            echo "=== giaoviec labels ==="
            docker inspect giaoviec --format "{{json .Config.Labels}}" 2>&1
            echo
            echo "=== giaoviec recent logs (last 30, timestamped) ==="
            docker logs --tail 30 --timestamps giaoviec 2>&1
            echo
            echo "=== proxy (traefik) labels ==="
            docker inspect proxy --format "{{json .Config.Labels}}" 2>&1
            echo
            echo "=== proxy networks ==="
            docker inspect proxy --format "{{json .NetworkSettings.Networks}}" 2>&1
            echo
            echo "=== postgres container 1 (q23xio57fs9rzyealfctartz) env, redacted ==="
            docker inspect q23xio57fs9rzyealfctartz --format "{{json .Config.Env}}" 2>&1 | sed -E "s#//[^:]+:[^@]+@#//REDACTED:REDACTED@#g"
            echo
            echo "=== postgres container 2 (s1le94kqxkeqnu38t2d4zurn) env, redacted ==="
            docker inspect s1le94kqxkeqnu38t2d4zurn --format "{{json .Config.Env}}" 2>&1 | sed -E "s#//[^:]+:[^@]+@#//REDACTED:REDACTED@#g"
            echo
            echo "=== unidentified container kvcfdz0e8acwkh24u0sm602d-072826740011 labels ==="
            docker inspect kvcfdz0e8acwkh24u0sm602d-072826740011 --format "{{json .Config.Labels}}" 2>&1
            echo
            echo "=== unidentified container cp73k73g6pywt6mazoqtvud2-123657296911 labels ==="
            docker inspect cp73k73g6pywt6mazoqtvud2-123657296911 --format "{{json .Config.Labels}}" 2>&1
            echo
            echo "=== coolify leftovers: any container with coolify in the name ==="
            docker ps -a --format "{{.Names}} | {{.Image}} | {{.Status}}" | grep -i cool || echo "(none)"
            echo
            echo "=== coolify leftovers: /data/coolify ==="
            ls -la /data/coolify 2>&1 | head -30
            echo
            echo "=== coolify leftovers: systemd units ==="
            systemctl list-units --all 2>&1 | grep -i cool || echo "(no coolify systemd unit)"
            echo
            echo "=== coolify leftovers: crontab ==="
            crontab -l 2>&1 | grep -i cool || echo "(no coolify cron entry)"
            echo
            echo "=== disk space ==="
            df -h /
          '

      - name: Restart backend
        if: ${{ github.event.inputs.action == 'restart_backend' }}
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=accept-new root@146.196.64.92 '
            set -e
            cd /opt/apps/bismart
            docker compose up -d --force-recreate
            sleep 5
            docker compose ps
            echo
            echo "=== backend logs after restart ==="
            docker logs --tail 50 bis_mart_backend
          '

      - name: Deploy backend (build + roll out latest code from this branch)
        if: ${{ github.event_name == 'push' || github.event.inputs.action == 'deploy_backend' }}
        run: |
          set -e
          IMAGE_TAG="bismart-backend:$(git rev-parse --short HEAD)"
          SSH="ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=accept-new root@146.196.64.92"

          echo "==> Uploading backend/ source to VPS"
          tar czf - -C backend . | $SSH '
            set -e
            rm -rf /opt/bismart-src
            mkdir -p /opt/bismart-src
            tar xzf - -C /opt/bismart-src
          '

          echo "==> Building image $IMAGE_TAG on VPS"
          $SSH "cd /opt/bismart-src && docker build -t $IMAGE_TAG -t bismart-backend:latest ."

          echo "==> Rolling out new container"
          $SSH "cd /opt/apps/bismart && docker compose up -d --force-recreate"

          echo "==> Waiting for health check"
          sleep 5
          $SSH "docker inspect bis_mart_backend --format 'health={{.State.Health.Status}}'" || true

          echo "==> Verifying live domain"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 "https://api.bismart.id.vn/healthz")
          echo "api.bismart.id.vn/healthz -> $code"
          if [ "$code" != "200" ]; then
            echo "::error::Healthz did not return 200 after deploy (got $code)"
            exit 1
          fi

      - name: Set admin account
        if: ${{ github.event.inputs.action == 'set_admin' }}
        env:
          ADMIN_EMPLOYEE_CODE: ${{ secrets.ADMIN_EMPLOYEE_CODE }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$ADMIN_EMPLOYEE_CODE" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "Thieu secret ADMIN_EMPLOYEE_CODE hoac ADMIN_PASSWORD" >&2
            exit 1
          fi
          ESC_PW=$(printf '%s' "$ADMIN_PASSWORD" | sed "s/'/''/g")
          ESC_CODE=$(printf '%s' "$ADMIN_EMPLOYEE_CODE" | sed "s/'/''/g")
          cat > /tmp/set_admin.sql <<SQL
          UPDATE employees SET password='$ESC_PW', position='ADM' WHERE employee_code='$ESC_CODE';
          SELECT employee_code, position FROM employees WHERE employee_code='$ESC_CODE';
          SQL
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=accept-new root@146.196.64.92 \
            'docker exec -i bismart-postgres psql -U bismart -d bismart' < /tmp/set_admin.sql
          rm -f /tmp/set_admin.sql

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
