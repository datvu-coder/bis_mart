name: iOS Build & TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bismart_flutter/**'
      - '.github/workflows/ios-testflight.yml'

jobs:
  build-and-upload:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: bismart_flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Apple now rejects TestFlight uploads built with an SDK older than
      # the current requirement. Rather than hard-code a version, select
      # whichever Xcode install on the runner reports the newest version.
      - name: Select newest available Xcode
        run: |
          sudo xcode-select -p
          ls /Applications | grep -i Xcode || true
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - name: Flutter pub get
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: pod install --repo-update
        working-directory: bismart_flutter/ios

      - name: Flutter build (compiles Dart, prepares Flutter.framework)
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      # Manual signing: import the team's existing Apple Distribution
      # certificate + provisioning profile instead of letting Xcode
      # auto-provision (which kept minting a new per-machine "Apple
      # Development" cert every CI run until the account's cert limit
      # was hit).
      - name: Install signing certificate and provisioning profile
        env:
          APPSTORE_P12_CERTIFICATE: ${{ secrets.APPSTORE_P12_CERTIFICATE }}
          APPSTORE_P12_PASSWORD: ${{ secrets.APPSTORE_P12_PASSWORD }}
          APPSTORE_PROVISIONING_PROFILE: ${{ secrets.APPSTORE_PROVISIONING_PROFILE }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo "APPSTORE_P12_CERTIFICATE length: ${#APPSTORE_P12_CERTIFICATE}"
          echo "APPSTORE_PROVISIONING_PROFILE length: ${#APPSTORE_PROVISIONING_PROFILE}"

          # Keep only valid base64 alphabet characters. Whitespace alone isn't
          # enough to sanitize copy-pasted secrets — stray characters (e.g. a
          # trailing "%" some shells append when copying output that doesn't
          # end in a newline) also break decoding and aren't whitespace.
          echo -n "$APPSTORE_P12_CERTIFICATE" | tr -dc 'A-Za-z0-9+/=' | base64 -D -o "$CERTIFICATE_PATH"
          echo -n "$APPSTORE_PROVISIONING_PROFILE" | tr -dc 'A-Za-z0-9+/=' | base64 -D -o "$PROFILE_PATH"

          echo "Decoded certificate.p12 size: $(wc -c < "$CERTIFICATE_PATH")"
          echo "Decoded profile.mobileprovision size: $(wc -c < "$PROFILE_PATH")"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$APPSTORE_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$PWD/build/ios/Runner.xcarchive"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/ios/Runner.xcarchive" \
            -exportPath "$PWD/build/ios/ipa" \
            -exportOptionsPlist ios/ExportOptions.plist

      - name: Write App Store Connect API key
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$APPSTORE_PRIVATE_KEY" > ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8

      - name: Locate exported IPA
        id: locate_ipa
        run: |
          IPA_PATH=$(find "$PWD/build/ios/ipa" -maxdepth 1 -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "No .ipa file found under build/ios/ipa" >&2
            ls -la "$PWD/build/ios/ipa" || true
            exit 1
          fi
          echo "Found IPA: $IPA_PATH"
          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "${{ steps.locate_ipa.outputs.ipa_path }}" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"

      - name: Clean up signing assets
        if: always()
        run: |
          rm -rf ~/private_keys
          rm -f "$RUNNER_TEMP/app-signing.keychain-db" "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/profile.mobileprovision"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Runner-ipa
          path: bismart_flutter/build/ios/ipa/*.ipa
          if-no-files-found: ignore
